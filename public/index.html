<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>강화하다 망함</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <section id="loginScreen">
    <h1>강화하다 망함</h1>
    <div id="buttonDiv"></div>
    <pre id="loginResult"></pre>
  </section>

  <section id="registerScreen" hidden>
    <h1>강화하다 망함</h1>
    <p>처음 오셨네요! 사용하실 닉네임을 입력해주세요.</p>
    <form id="registerForm">
      <input type="text" id="registerNickname" maxlength="20" required />
      <button type="submit">시작하기</button>
    </form>
    <pre id="registerResult"></pre>
  </section>

  <section id="gameScreen" hidden>
    <header>
      <strong id="playerName"></strong>
      <span>골드 <b id="gold"></b></span>
      <span>강화석 <b id="enhancementStone"></b></span>
      <span>다이아 <b id="diamond"></b></span>
      <span>클리어 스테이지 <b id="clearedStage"></b></span>
      <button type="button" id="logoutButton">로그아웃</button>
    </header>

    <nav>
      <button type="button" class="tabButton" data-tab="inventory">인벤토리</button>
      <button type="button" class="tabButton" data-tab="enhancement">강화</button>
      <button type="button" class="tabButton" data-tab="synthesis">합성</button>
      <button type="button" class="tabButton" data-tab="battle">전투</button>
      <button type="button" class="tabButton" data-tab="mailbox">우편함</button>
    </nav>

    <section id="inventoryPanel" class="tabPanel"></section>
    <section id="enhancementPanel" class="tabPanel" hidden></section>
    <section id="synthesisPanel" class="tabPanel" hidden></section>
    <section id="battlePanel" class="tabPanel" hidden></section>
    <section id="mailboxPanel" class="tabPanel" hidden></section>
  </section>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
